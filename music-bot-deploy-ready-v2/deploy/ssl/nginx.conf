server {
  listen 443 ssl;
  server_name dj-nino.live;

  ssl_certificate /etc/letsencrypt/live/dj-nino.live/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dj-nino.live/privkey.pem;

  location / {
    proxy_pass http://localhost:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}